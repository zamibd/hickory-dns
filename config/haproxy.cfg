global
    log stdout format raw local0
    maxconn 50000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend dns_in
    bind *:53
    default_backend hickory_dns

backend hickory_dns
    balance roundrobin
    # Health-check Prometheus metrics port; DNS port requires PROXY v2 for queries.
    option httpchk
    http-check connect port 9000
    http-check send meth GET uri /metrics ver HTTP/1.0 hdr Host localhost
    http-check expect status 200
    server dns1 hickory-dns-1:5301 check port 9000 send-proxy-v2 inter 5s fall 3 rise 2
    server dns2 hickory-dns-2:5301 check port 9000 send-proxy-v2 inter 5s fall 3 rise 2
    server dns3 hickory-dns-3:5301 check port 9000 send-proxy-v2 inter 5s fall 3 rise 2
